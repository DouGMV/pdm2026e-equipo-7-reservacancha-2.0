# CI de ReservaCancha: cada push y cada Pull Request se verifica en una
# máquina limpia, con la misma versión de Flutter que usa el equipo.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch: # botón "Run workflow" en la pestaña Actions

# Si se hace push dos veces seguidas a la misma rama, se cancela la corrida vieja.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    # Este nombre es el check requerido en las reglas de main y develop.
    name: Formato, análisis y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Misma versión que usa todo el equipo (ver docs/TECNOLOGIAS.md)
          flutter-version: 3.47.6
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Formato (dart format)
        run: dart format --output=none --set-exit-if-changed .

      - name: Análisis estático (flutter analyze)
        run: flutter analyze

      - name: Pruebas (flutter test)
        run: flutter test --reporter expanded
