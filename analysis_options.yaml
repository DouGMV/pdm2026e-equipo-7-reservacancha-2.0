# Reglas de análisis estático del equipo. Se ejecutan con `flutter analyze`
# y en el CI. Cambios a este archivo se proponen por PR (ver docs/ROLES.md).
# Lista completa de reglas: https://dart.dev/lints

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    # Generado por `flutterfire configure`
    - lib/firebase_options.dart
  language:
    # Obliga a convertir explícitamente los valores `dynamic`, por ejemplo
    # al leer mapas de Firestore en `fromMap`: `map['nombre'] as String`.
    strict-casts: true
    # Prohíbe tipos genéricos sin parámetros (`List` en lugar de `List<Cancha>`).
    strict-raw-types: true

linter:
  rules:
    # Estilo
    - prefer_single_quotes
    - always_use_package_imports
    - directives_ordering

    # Widgets const (AGENTS.md: "Preferir widgets const")
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables

    # Variables que no cambian
    - prefer_final_locals
    - prefer_final_in_for_each

    # Código asíncrono (Firebase): no olvidar `await` ni cerrar streams
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
